name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  rust-ci:
    # rs-ci main resolved at 2026-09-07; upgrade only after auditing the workflow diff.
    uses: qubit-ltd/rs-ci/.github/workflows/rust-ci.yml@128d7bed407e70e03c24e00eda731264438bc035
    with:
      coverage_enforce_thresholds: "1"
