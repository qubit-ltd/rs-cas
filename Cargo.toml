[package]
name = "qubit-cas"
version = "0.10.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-cas"
description = "Typed compare-and-swap executor with retry-aware conflict handling"
homepage = "https://github.com/qubit-ltd/rs-cas"
documentation = "https://docs.rs/qubit-cas"
readme = "README.md"
keywords = ["cas", "compare-and-swap", "retry", "atomic", "qubit"]
categories = ["concurrency", "asynchronous"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/RUST_CODING_STYLE.md",
    "/RUST_CODING_STYLE.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/benches/**",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_cas"
doctest = true

[[bench]]
name = "observability_overhead"
harness = false

[features]
default = []
tokio = ["dep:tokio", "qubit-retry/tokio"]

[dependencies]
tokio = { version = "1.52", features = ["time", "rt"], optional = true }

qubit-atomic = "0.13"
qubit-error = "0.2"
qubit-function = "0.16"
qubit-retry = { version = "=0.19.0", path = "../rs-retry" }

[dev-dependencies]
qubit-clock = { version = "0.13", features = ["test-util"] }
tokio = { version = "1.52", features = ["full", "test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
type_complexity = "allow"
