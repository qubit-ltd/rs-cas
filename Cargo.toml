[package]
name = "qubit-cas"
version = "0.10.0"
edition = "2024"
# Keep public contracts in one harness to share fixtures and inline coverage maps.
autotests = false
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-cas"
description = "Typed compare-and-swap executor with retry-aware conflict handling"
homepage = "https://github.com/qubit-ltd/rs-cas"
documentation = "https://docs.rs/qubit-cas"
readme = "README.md"
keywords = ["cas", "compare-and-swap", "retry", "atomic", "qubit"]
categories = ["concurrency", "asynchronous"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
    "/benches/**",
]

[lib]
name = "qubit_cas"
doctest = true

[[test]]
name = "lib_tests"
path = "tests/lib_tests.rs"

[[bench]]
name = "observability_overhead"
harness = false

[[bench]]
name = "contention"
harness = false

[features]
default = []
tokio = ["dep:tokio", "qubit-retry/tokio"]

[dependencies]
tokio = { version = "1.53", features = ["time", "rt"], optional = true }

qubit-atomic = "0.17"
qubit-error = "0.2"
qubit-function = "0.18"
qubit-retry = "0.23"

[dev-dependencies]
qubit-clock = { version = "0.13", features = ["test-util"] }
tokio = { version = "1.53", features = ["full", "test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
type_complexity = "allow"
